<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الأرباح | NEXFUND</title><link rel="stylesheet" href="/app/app.css">
<style>.card{border:1px solid #29384c;background:#101a28;border-radius:12px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sub{color:#aab5c3}.filters{display:flex;gap:10px;flex-wrap:wrap}.wallet{word-break:break-all}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><header class="top"><a class="brand" href="/"><span class="mark">N</span>NEX<span>FUND</span></a><nav><a href="/admin/">لوحة الإدارة</a></nav></header><main class="wrap">
<section class="intro"><p class="eyebrow">ADMIN · PAYOUT REVIEW</p><h1>إدارة طلبات الأرباح</h1><p class="sub">مراجعة الطلبات، قبولها أو رفضها، وتسجيل مرجع التحويل عند إتمام الدفع.</p></section>
<section class="panel filters"><label>الحالة<select id="filter"><option value="">كل الطلبات</option><option value="pending">قيد المراجعة</option><option value="approved">مقبول</option><option value="rejected">مرفوض</option><option value="paid">مدفوع</option></select></label><button class="secondary" id="refresh">تحديث</button><p id="msg" class="message" role="status"></p></section><section id="list">جار تحميل الطلبات…</section></main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+" USD";
async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"رد غير صالح"}));if(!r.ok)throw Error(d.error||"فشل الطلب");return d;}
const statuses={pending:"قيد المراجعة",approved:"مقبول",rejected:"مرفوض",paid:"تم الدفع"};
async function copyWallet(address){try{await navigator.clipboard.writeText(address);$("msg").textContent="تم نسخ عنوان المحفظة.";}catch{$("msg").textContent="تعذر نسخ العنوان.";}}
async function load(){
 try{
  const status=$("filter").value;
  const data=await api("/api/admin/payouts"+(status?"?status="+encodeURIComponent(status):""));
  const payouts=data.payouts||[];
  $("list").innerHTML=payouts.length?payouts.map(p=>'<article class="card"><h3>'+money(p.requested_amount_usd)+' · '+esc(statuses[p.status]||p.status)+'</h3><p class="sub">'+esc(p.email)+' · '+esc(p.challenge_id)+' · '+esc(p.created_at)+'</p><p>الرصيد: '+money(p.current_balance)+' · الأساسي: '+money(p.initial_balance)+' · الربح: '+money(Number(p.current_balance)-Number(p.initial_balance))+'</p>'+(p.payout_wallet_address?'<p class="wallet">محفظة السحب: <code>'+esc(p.payout_wallet_address)+'</code> <button type="button" class="secondary copy-wallet" data-wallet="'+esc(p.payout_wallet_address)+'">نسخ</button></p>':'')+(p.tx_reference?'<p>TX: '+esc(p.tx_reference)+'</p>':'')+'<div class="grid"><label>ملاحظة/سبب<textarea id="note-'+esc(p.id)+'" maxlength="1000">'+esc(p.admin_note||"")+'</textarea></label><label>مرجع التحويل<input id="tx-'+esc(p.id)+'" maxlength="160" value="'+esc(p.tx_reference||"")+'"></label></div>'+(p.status==="pending"?'<div class="grid"><button data-id="'+esc(p.id)+'" data-status="approved">قبول الطلب</button><button data-id="'+esc(p.id)+'" data-status="rejected">رفض الطلب</button></div>':p.status==="approved"?'<div class="grid"><button data-id="'+esc(p.id)+'" data-status="paid">تأكيد الدفع</button></div>':'')+'</article>').join(""):'لا توجد طلبات.';
  document.querySelectorAll("button[data-status]").forEach(b=>b.onclick=()=>update(b.dataset.id,b.dataset.status));
  document.querySelectorAll(".copy-wallet").forEach(b=>b.onclick=()=>copyWallet(b.dataset.wallet));
 }catch(e){$("list").textContent=e.message;}
}
async function update(id,status){
 const note=$("note-"+id).value,tx=$("tx-"+id).value;
 if(status==="rejected"&&!note.trim()){alert("اكتب سبب الرفض.");return;}
 if(status==="paid"&&!tx.trim()){alert("أدخل مرجع التحويل قبل تأكيد الدفع.");return;}
 if(!confirm("تأكيد تحديث الطلب إلى "+statuses[status]+"؟"))return;
 try{await api("/api/admin/payouts/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status,admin_note:note,tx_reference:tx})});$("msg").textContent="تم تحديث الطلب وإشعار المتداول.";await load();}
 catch(e){$("msg").textContent=e.message;}
}
$("filter").onchange=load;$("refresh").onclick=load;
api("/api/auth/me").then(d=>{if(!d.user||d.user.role!=="admin")location.href="/app/";}).catch(()=>location.href="/app/");load();
</script></body></html>
