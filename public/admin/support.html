<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الدعم | NEXFUND</title><link rel="stylesheet" href="/app/app.css"><style>.support-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.5fr);gap:16px}.ticket{border:1px solid #29384c;border-radius:12px;padding:14px;margin:10px 0;background:#101a28;cursor:pointer}.ticket.active{border-color:#a8f36b}.ticket small{color:#aab5c3}.chat{min-height:200px;max-height:55vh;overflow:auto;padding:10px}.bubble{border:1px solid #29384c;border-radius:12px;padding:12px;margin:10px 0;background:#101a28}.bubble.admin{border-color:#426b4a}textarea{min-height:100px}.filters{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){.support-layout{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/"><span class="mark">N</span>NEX<span>FUND</span></a><nav><a href="/admin/">لوحة الإدارة</a> · <a href="/app/">بوابة المتداول</a></nav></header><main class="wrap"><section class="intro"><p class="eyebrow">ADMIN · SUPPORT</p><h1>إدارة تذاكر الدعم</h1><p class="sub">مراجعة طلبات المتداولين والرد عليها وتغيير الحالة.</p></section><section class="panel filters"><label>تصفية الحالة<select id="filter"><option value="">كل الحالات</option><option value="open">مفتوحة</option><option value="in_progress">قيد المعالجة</option><option value="resolved">تم الحل</option><option value="closed">مغلقة</option></select></label><button class="secondary" id="refresh">تحديث القائمة</button><p id="listMsg" class="message"></p></section><section class="support-layout"><section class="panel"><h2>التذاكر</h2><div id="ticketList">جار التحميل…</div></section><section class="panel"><h2 id="title">تفاصيل التذكرة</h2><p id="meta" class="sub">اختر تذكرة.</p><div id="messages" class="chat"></div><div id="controls" class="hidden"><label>الحالة<select id="status"><option value="open">مفتوحة</option><option value="in_progress">قيد المعالجة</option><option value="resolved">تم الحل</option><option value="closed">مغلقة</option></select></label><button id="saveStatus" class="secondary">حفظ الحالة</button><form id="replyForm"><label>الرد<textarea id="reply" maxlength="4000" minlength="2" required></textarea></label><button class="primary" id="replyBtn">إرسال الرد</button></form><p id="detailMsg" class="message"></p></div></section></section></main><script>
const $=id=>document.getElementById(id);let current=null;
async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"استجابة غير صالحة"}));if(!r.ok)throw Error(d.error||"فشل الطلب");return d}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st={open:"مفتوحة",in_progress:"قيد المعالجة",resolved:"تم الحل",closed:"مغلقة"},cats={payment:"الدفع",account:"الحساب",challenge:"التحدي",technical:"تقنية",other:"أخرى"};
async function load(){try{const f=$("filter").value;const d=await api("/api/admin/support/tickets"+(f?"?status="+encodeURIComponent(f):""));const t=d.tickets||[];$("ticketList").innerHTML=t.length?t.map(x=>'<article class="ticket '+(current===x.id?"active":"")+'" data-id="'+esc(x.id)+'"><strong>'+esc(x.subject)+'</strong><br><small>'+esc(x.email)+' · '+esc(cats[x.category]||x.category)+' · '+esc(st[x.status]||x.status)+'</small></article>').join(""):'لا توجد تذاكر.';document.querySelectorAll(".ticket").forEach(e=>e.addEventListener("click",()=>open(e.dataset.id)));}catch(e){$("ticketList").textContent=e.message;}}
async function open(id){current=id;try{const d=await api("/api/admin/support/tickets/"+encodeURIComponent(id)+"/messages");const t=d.ticket;$("title").textContent=t.subject;$("meta").textContent=t.email+" · "+(cats[t.category]||t.category)+" · "+(st[t.status]||t.status)+" · "+t.id;$("status").value=t.status;$("controls").classList.remove("hidden");$("messages").innerHTML=d.messages.map(m=>'<article class="bubble '+(m.author_role==="admin"?"admin":"")+'"><small>'+ (m.author_role==="admin"?"NEXFUND Support":"Trader")+' · '+esc(m.created_at)+'</small><p>'+esc(m.message).replace(/\n/g,"<br>")+'</p></article>').join("");$("messages").scrollTop=$("messages").scrollHeight;await load();}catch(e){$("meta").textContent=e.message;}}
$("filter").addEventListener("change",load);$("refresh").addEventListener("click",load);
$("saveStatus").addEventListener("click",async()=>{if(!current)return;try{await api("/api/admin/support/tickets/"+encodeURIComponent(current),{method:"PATCH",body:JSON.stringify({status:$("status").value})});$("detailMsg").textContent="تم تحديث الحالة وإشعار المتداول.";await open(current);}catch(e){$("detailMsg").textContent=e.message;}});
$("replyForm").addEventListener("submit",async e=>{e.preventDefault();if(!current)return;$("replyBtn").disabled=true;try{await api("/api/admin/support/tickets/"+encodeURIComponent(current)+"/messages",{method:"POST",body:JSON.stringify({message:$("reply").value})});$("reply").value="";$("detailMsg").textContent="تم إرسال الرد وإشعار المتداول.";await open(current);}catch(err){$("detailMsg").textContent=err.message;}finally{$("replyBtn").disabled=false;}});
api("/api/auth/me").then(d=>{if(!d.user||d.user.role!=="admin")location.href="/app/";}).catch(()=>location.href="/app/");load();
</script></body></html>
