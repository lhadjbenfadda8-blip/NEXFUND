<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إرسال إشعار | NEXFUND Admin</title><link rel="stylesheet" href="/app/app.css"></head><body><header class="top"><a class="brand" href="/"><span class="mark">N</span>NEX<span>FUND</span></a><nav><a href="/admin/">لوحة الإدارة</a> · <a href="/app/">بوابة المتداول</a></nav></header><main class="wrap"><section class="intro"><p class="eyebrow">ADMIN · COMMUNICATION</p><h1>إرسال إعلان للمتداولين</h1><p class="sub">إرسال إشعار عام لجميع الحسابات المسجلة. راجع المحتوى قبل الإرسال.</p></section><section class="panel"><form id="form"><label>عنوان الإشعار<input id="title" maxlength="140" minlength="3" required></label><label>نص الإشعار<textarea id="body" maxlength="2000" minlength="5" required></textarea></label><button id="send" class="primary">إرسال إلى جميع المستخدمين</button><p id="status" class="message" role="status"></p></form></section></main><script>const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"رد غير صالح"}));if(!r.ok)throw Error(d.error||"فشل الطلب");return d}api("/api/auth/me").then(d=>{if(!d.user||d.user.role!=="admin")location.href="/app/";}).catch(()=>location.href="/app/");$("form").addEventListener("submit",async e=>{e.preventDefault();if(!confirm("هل تريد إرسال هذا الإشعار لجميع المستخدمين؟"))return;$("send").disabled=true;$("status").textContent="جار الإرسال…";try{const d=await api("/api/admin/notifications/broadcast",{method:"POST",body:JSON.stringify({title:$("title").value,body:$("body").value})});$("status").textContent="تم إرسال الإشعار إلى "+d.delivered+" مستخدمًا.";$("form").reset();}catch(err){$("status").textContent=err.message;}finally{$("send").disabled=false;}});</script></body></html>
