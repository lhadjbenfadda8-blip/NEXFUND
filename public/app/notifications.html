<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشعارات | NEXFUND</title><link rel="stylesheet" href="/app/app.css"><style>.notice-card{border:1px solid #29384c;background:#101a28;border-radius:14px;padding:15px;margin:12px 0}.notice-card.unread{border-color:#a8f36b}.notice-card h3{margin:0 0 6px}.notice-card p{margin:5px 0;color:#aab5c3}.notice-card small{color:#aab5c3}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.count{font-weight:bold;color:#a8f36b}</style></head><body><header class="top"><a class="brand" href="/"><span class="mark">N</span>NEX<span>FUND</span></a><nav><a href="/app/">لوحة المتداول</a> · <a href="/app/support.html">مركز الدعم</a></nav></header><main class="wrap"><section class="intro"><p class="eyebrow">ACCOUNT CENTER</p><h1>مركز الإشعارات</h1><p class="sub">متابعة تحديثات الحساب، التقييم، الدفع، الدعم، ورسائل الإدارة.</p></section><section class="panel"><div class="toolbar"><span>غير المقروء: <span id="count" class="count">—</span></span><button class="secondary" id="markAll">تحديد الكل كمقروء</button><button class="secondary" id="refresh">تحديث</button></div><p id="status" class="message"></p><div id="list" class="empty">جار تحميل الإشعارات…</div></section></main><script>
const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"تعذر قراءة الرد"}));if(!r.ok)throw Error(d.error||"تعذر تنفيذ الطلب");return d}const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){try{const d=await api("/api/notifications?limit=50");$("count").textContent=d.unread_count||0;const ns=d.notifications||[];$("list").innerHTML=ns.length?ns.map(n=>'<article class="notice-card '+(!n.read_at?"unread":"")+'"><h3>'+esc(n.title)+'</h3><p>'+esc(n.body).replace(/\n/g,"<br>")+'</p><small>'+esc(n.created_at)+(n.read_at?" · مقروء":" · جديد")+'</small>'+(n.read_at?"":' <button class="secondary mark" data-id="'+esc(n.id)+'">تحديد كمقروء</button>')+'</article>').join(""):'لا توجد إشعارات.';document.querySelectorAll(".mark").forEach(b=>b.onclick=async()=>{try{await api("/api/notifications/"+encodeURIComponent(b.dataset.id)+"/read",{method:"PATCH"});load();}catch(e){$("status").textContent=e.message;}});}catch(e){$("status").textContent=e.message;if(e.message.includes("Authentication"))location.href="/app/";}}$("markAll").onclick=async()=>{try{await api("/api/notifications/read-all",{method:"POST"});$("status").textContent="تم تحديد جميع الإشعارات كمقروءة.";await load();}catch(e){$("status").textContent=e.message;}};$("refresh").onclick=load;api("/api/auth/me").then(d=>{if(!d.user)location.href="/app/";}).catch(()=>location.href="/app/");load();
</script></body></html>
