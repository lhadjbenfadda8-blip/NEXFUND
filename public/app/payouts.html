<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الأرباح | NEXFUND</title><link rel="stylesheet" href="/app/app.css"><style>.card{border:1px solid #29384c;background:#101a28;border-radius:12px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sub{color:#aab5c3}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/"><span class="mark">N</span>NEX<span>FUND</span></a><nav><a href="/app/">لوحة المتداول</a> · <a href="/app/analytics.html">التحليلات</a></nav></header><main class="wrap"><section class="intro"><p class="eyebrow">PAYOUT CENTER</p><h1>طلبات الأرباح</h1><p class="sub">تعرض هذه الصفحة طلباتك وأهلية السحب بناءً على حسابات اجتازت التقييم. نسبة السقف الحالية 80% من الربح المحسوب، والطلب يخضع للمراجعة.</p></section><section class="panel"><h2>طلب سحب جديد</h2><form id="form"><label>حساب مؤهل<select id="challenge" required><option value="">جار تحميل الحسابات…</option></select></label><p id="limit" class="sub">اختر حسابًا لمعرفة سقف الطلب.</p><label>المبلغ (USD)<input id="amount" type="number" min="0.01" step="0.01" required></label><label>محفظة استلام USDT · TRC20<input id="wallet" type="text" minlength="34" maxlength="34" autocomplete="off" spellcheck="false" placeholder="T..." required><small class="sub">أدخل عنوان محفظة TRON (TRC20) بدقة.</small></label><button id="submit" class="primary">إرسال طلب الأرباح</button><p id="msg" class="message"></p></form></section><section class="panel"><h2>طلباتي السابقة</h2><div id="history">جار التحميل…</div></section></main><script>
const $=id=>document.getElementById(id);let eligible=[];const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+" USD";const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"تعذر قراءة الرد"}));if(!r.ok)throw Error(d.error||"فشل الطلب");return d}const statuses={pending:"قيد المراجعة",approved:"مقبول",rejected:"مرفوض",paid:"تم الدفع"};async function load(){try{const d=await api("/api/payouts");eligible=d.eligible_challenges||[];$("challenge").innerHTML='<option value="">اختر حسابًا اجتاز التقييم</option>'+eligible.map(c=>'<option value="'+esc(c.challenge_id)+'">'+esc(c.challenge_id)+' · ربح '+money(c.profit)+' · سقف '+money(c.max_payout_usd)+'</option>').join("");$("history").innerHTML=(d.payouts||[]).length?d.payouts.map(p=>'<article class="card"><strong>'+money(p.requested_amount_usd)+' · '+esc(statuses[p.status]||p.status)+'</strong><p class="sub">Challenge: '+esc(p.challenge_id)+' · '+esc(p.created_at)+'</p>'+(p.admin_note?'<p>ملاحظة: '+esc(p.admin_note)+'</p>':'')+(p.payout_wallet_address?'<p>محفظة السحب: <code>'+esc(p.payout_wallet_address)+'</code></p>':'')+(p.tx_reference?'<p>مرجع الدفع: '+esc(p.tx_reference)+'</p>':'')+'</article>').join(""):'لا توجد طلبات سحب بعد.';}catch(e){$("msg").textContent=e.message;if(e.message.includes("Authentication"))location.href="/app/";}}$("challenge").onchange=()=>{const c=eligible.find(x=>x.challenge_id===$("challenge").value);$("limit").textContent=c?"الربح: "+money(c.profit)+" · الحد الأعلى: "+money(c.max_payout_usd):"اختر حسابًا لمعرفة سقف الطلب.";if(c)$("amount").max=Number(c.max_payout_usd).toFixed(2);};$("form").onsubmit=async e=>{e.preventDefault();$("submit").disabled=true;try{const d=await api("/api/payouts",{method:"POST",body:JSON.stringify({challenge_id:$("challenge").value,amount_usd:Number($("amount").value),payout_wallet_address:$("wallet").value.trim()})});$("msg").textContent="تم تقديم الطلب. رقم الطلب: "+d.payout_id+" — الحالة: "+d.status;$("amount").value="";await load();}catch(err){$("msg").textContent=err.message;}finally{$("submit").disabled=false;}};api("/api/auth/me").then(d=>{if(!d.user)location.href="/app/";}).catch(()=>location.href="/app/");load();
</script></body></html>
