<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الدعم | NEXFUND</title><link rel="stylesheet" href="/app/app.css"><style>.support-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.5fr);gap:16px}.ticket{border:1px solid #29384c;border-radius:12px;padding:14px;margin:10px 0;background:#101a28;cursor:pointer}.ticket.active{border-color:#a8f36b}.ticket small{color:#aab5c3}.chat{min-height:180px;max-height:55vh;overflow:auto;padding:10px}.bubble{border:1px solid #29384c;border-radius:12px;padding:12px;margin:10px 0;background:#101a28}.bubble.admin{border-color:#426b4a}.bubble small{color:#aab5c3}.support-form textarea{min-height:110px}@media(max-width:700px){.support-layout{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/"><span class="mark">N</span>NEX<span>FUND</span></a><nav><a href="/app/">لوحة المتداول</a> · <a href="/guide.html">دليل الخدمات</a></nav></header><main class="wrap"><section class="intro"><p class="eyebrow">TRADER SUPPORT</p><h1>مركز الدعم</h1><p class="sub">أنشئ طلبًا، تابع حالته، وتواصل مع فريق الدعم من مكان واحد.</p></section><section class="panel"><h2>فتح تذكرة جديدة</h2><form id="newTicket" class="support-form"><label>نوع المشكلة<select id="category"><option value="payment">الدفع والتحويل</option><option value="account">الحساب وتسجيل الدخول</option><option value="challenge">التحدي والتقييم</option><option value="technical">مشكلة تقنية</option><option value="other">أخرى</option></select></label><label>عنوان التذكرة<input id="subject" maxlength="120" minlength="4" required></label><label>شرح المشكلة<textarea id="firstMessage" maxlength="4000" minlength="10" required></textarea></label><button class="primary" id="createBtn">إرسال التذكرة</button><p class="message" id="createMsg"></p></form></section><section class="support-layout"><section class="panel"><div class="dash-head"><h2>تذاكري</h2><button class="secondary" id="refresh">تحديث</button></div><p id="listMsg" class="message"></p><div id="ticketList" class="empty">جار التحميل…</div></section><section class="panel"><h2 id="detailTitle">تفاصيل التذكرة</h2><p id="detailStatus" class="sub">اختر تذكرة من القائمة.</p><div id="messages" class="chat"></div><form id="replyForm" class="hidden"><label>ردك<textarea id="reply" maxlength="4000" minlength="2" required></textarea></label><button class="primary" id="replyBtn">إرسال الرد</button><p id="replyMsg" class="message"></p></form></section></section><p class="foot">لا ترسل كلمات مرور أو مفاتيح خاصة أو معلومات حساسة داخل التذاكر.</main><script>
const $=id=>document.getElementById(id);let currentTicket=null;
async function api(path,opt={}){const r=await fetch(path,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});const d=await r.json().catch(()=>({error:"استجابة غير صالحة"}));if(!r.ok)throw Error(d.error||"فشل الطلب");return d}
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const statusLabels={open:"مفتوحة",in_progress:"قيد المعالجة",resolved:"تم الحل",closed:"مغلقة"},catLabels={payment:"الدفع",account:"الحساب",challenge:"التحدي",technical:"تقنية",other:"أخرى"};
async function loadTickets(){try{const d=await api("/api/support/tickets");const list=d.tickets||[];$("ticketList").innerHTML=list.length?list.map(t=>'<article class="ticket '+(currentTicket===t.id?'active':'')+'" data-id="'+esc(t.id)+'"><strong>'+esc(t.subject)+'</strong><br><small>'+esc(catLabels[t.category]||t.category)+' · '+esc(statusLabels[t.status]||t.status)+' · '+esc(t.updated_at)+'</small></article>').join(""):'لا توجد تذاكر حتى الآن.';document.querySelectorAll(".ticket").forEach(el=>el.addEventListener("click",()=>openTicket(el.dataset.id)));}catch(e){$("ticketList").textContent=e.message;}}
async function openTicket(id){currentTicket=id;try{const d=await api("/api/support/tickets/"+encodeURIComponent(id));$("detailTitle").textContent=d.ticket.subject;$("detailStatus").textContent="الحالة: "+(statusLabels[d.ticket.status]||d.ticket.status);$("messages").innerHTML=(d.messages||[]).map(m=>'<article class="bubble '+(m.author_role==="admin"?"admin":"")+'"><small>'+ (m.author_role==="admin"?"NEXFUND Support":"أنت")+' · '+esc(m.created_at)+'</small><p>'+esc(m.message).replace(/\n/g,"<br>")+'</p></article>').join("");$("messages").scrollTop=$("messages").scrollHeight;$("replyForm").classList.toggle("hidden",d.ticket.status==="closed");await loadTickets();}catch(e){$("detailStatus").textContent=e.message;}}
$("newTicket").addEventListener("submit",async e=>{e.preventDefault();$("createBtn").disabled=true;$("createMsg").textContent="جارٍ إنشاء التذكرة…";try{const d=await api("/api/support/tickets",{method:"POST",body:JSON.stringify({category:$("category").value,subject:$("subject").value,message:$("firstMessage").value})});$("createMsg").textContent="تم إنشاء التذكرة بنجاح. رقمها: "+d.ticket_id;$("newTicket").reset();await loadTickets();await openTicket(d.ticket_id);}catch(err){$("createMsg").textContent=err.message;}finally{$("createBtn").disabled=false;}});
$("replyForm").addEventListener("submit",async e=>{e.preventDefault();if(!currentTicket)return;$("replyBtn").disabled=true;try{await api("/api/support/tickets/"+encodeURIComponent(currentTicket)+"/messages",{method:"POST",body:JSON.stringify({message:$("reply").value})});$("reply").value="";$("replyMsg").textContent="تم إرسال ردك." ;await openTicket(currentTicket);}catch(err){$("replyMsg").textContent=err.message;}finally{$("replyBtn").disabled=false;}});
$("refresh").addEventListener("click",loadTickets);api("/api/auth/me").then(d=>{if(!d.user)location.href="/app/";}).catch(()=>location.href="/app/");loadTickets();
</script></body></html>
