name: NEXFUND CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Worker and risk module
        run: |
          node --experimental-default-type=module --check src/index.js
          node --experimental-default-type=module --check src/risk-engine.js
          node --experimental-default-type=module --check src/rate-limit.js
          node --experimental-default-type=module --check src/tron-address.js
      - name: Risk engine regression tests
        run: node --experimental-default-type=module --test tests/risk-engine.test.js
      - name: Authentication rate limit tests
        run: node --experimental-default-type=module --test tests/rate-limit.test.js
      - name: TRON address validation tests
        run: node --experimental-default-type=module --test tests/tron-address.test.js
      - name: Frontend inline script syntax tests
        run: node --experimental-default-type=module --test tests/frontend-syntax.test.js
